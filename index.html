<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}

.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0}

.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mu)}

.tbl{overflow-x:auto}

th{background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.fb{border-left:4px solid var(--ac);padding-left:10px;margin:10px 0;font-size:15px}
.tag{display:inline-block;background:color-mix(in srgb,var(--ac) 15%,var(--card));color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
li{margin:4px 0}

body{background:radial-gradient(900px 420px at 50% -8%,color-mix(in srgb,var(--ac) 24%,transparent),transparent) no-repeat,var(--bg);min-height:100vh}

.hero h1{margin:4px 0;font-size:28px}.hero p{margin:4px 0;opacity:.93}.hero .back{color:#fff;text-decoration:underline}.logo{font-size:46px}

.row.g1{border-left:5px solid #f2b400}.row.g2{border-left:5px solid #9aa4b2}.row.g3{border-left:5px solid #c9824a}

<script>
var SB={url:"https://xnovjryifyczchtmqzib.supabase.co",key:"sb_publishable_Zs3sf2BJAvxV1z-fwrVpSQ_NpYd6fJC"};
var PARTS=[
{name:"Basic concepts",icon:"🤰",qs:[
["What is the recommended total gestational weight gain for a woman entering pregnancy with a normal pre-pregnancy BMI of 18.5–24.9 kg/m²?",["5–9 kg","7–11 kg","11–16 kg","14–18 kg"],2,["Closer to the recommended gain for women with obesity.","The recommended range for women who are overweight.","Correct. The recommended total gain for a normal pre-pregnancy BMI is about 11–16 kg.","Generally above the recommended range for a normal BMI."]],
["By what transport mechanism does glucose cross the placenta from mother to fetus?",["Simple diffusion","Facilitated diffusion","Active transport","Pinocytosis"],1,["Simple diffusion transfers respiratory gases such as O₂ and CO₂.","Correct. Glucose crosses via facilitated diffusion through GLUT-1 transporters in the syncytiotrophoblast.","Active transport moves amino acids, calcium, iron and water-soluble vitamins.","Pinocytosis transfers large proteins such as maternal IgG."]],
["According to NICE, what are the diagnostic thresholds on a 2-hour 75 g OGTT for gestational diabetes?",["Fasting ≥ 5.1 or 2-hour ≥ 8.5 mmol/L","Fasting ≥ 5.6 or 2-hour ≥ 7.8 mmol/L","Fasting ≥ 7.0 or 2-hour ≥ 11.1 mmol/L","Fasting ≥ 6.1 or 2-hour ≥ 10.0 mmol/L"],1,["These match IADPSG/WHO criteria, not NICE.","Correct. NICE diagnoses GDM at fasting ≥ 5.6 mmol/L or 2-hour ≥ 7.8 mmol/L.","These values are in the diabetic range, not the NICE GDM thresholds.","These do not match the standard NICE thresholds."]],
["When do serum hCG levels peak in a normal singleton pregnancy?",["8–10 days post-fertilisation","6–8 weeks","60–70 days (8–10 weeks)","16–20 weeks"],2,["hCG first becomes detectable around this time; it has not peaked.","hCG is rising rapidly but has not yet reached its maximum.","Correct. hCG peaks at about 60–70 days, then gradually declines.","By then hCG has already fallen from its peak."]],
["Which definition correctly describes a small for gestational age (SGA) fetus?",["Estimated birthweight below 2,500 g regardless of gestation","Estimated fetal weight below the 10th centile for gestational age","Asymmetrical head-to-abdomen ratio on ultrasound","Failure to reach genetic growth potential due to placental failure"],1,["This defines low birthweight; weight must be judged against gestational age.","Correct. SGA means estimated fetal weight or birthweight below the 10th centile for gestational age.","This may be a feature of asymmetrical growth restriction but is not the definition of SGA.","This describes fetal growth restriction (FGR), a pathological process."]],
["What is the primary cause of physiological anaemia in normal pregnancy?",["Severe maternal iron deficiency due to fetal use","Decreased erythropoietin production by the maternal kidneys","Disproportionate expansion of plasma volume relative to red cell mass","Increased destruction and shortened lifespan of red cells"],2,["Iron needs rise, but the main cause is plasma volume expansion, not iron deficiency.","Erythropoietin actually increases in pregnancy.","Correct. Plasma volume rises by about 40–50% but red cell mass by only 20–30%, causing haemodilution.","Increased red cell destruction is not the primary cause."]],
["Pre-eclampsia is defined as new-onset hypertension arising after which gestational milestone?",["12 weeks","16 weeks","20 weeks","28 weeks"],2,["Hypertension before 20 weeks suggests pre-existing chronic hypertension.","Not the diagnostic threshold for pre-eclampsia.","Correct. Pre-eclampsia develops at or after 20 weeks, with proteinuria or maternal organ or uteroplacental dysfunction.","It can occur before 28 weeks, from 20 weeks onwards."]],
["On ultrasound, which measurement defines oligohydramnios?",["Maximum vertical pool 8 cm or AFI > 25 cm","Maximum vertical pool < 2 cm or AFI ≤ 5 cm","Maximum vertical pool between 2 cm and 8 cm","AFI between 5 cm and 8 cm"],1,["These values indicate polyhydramnios.","Correct. Oligohydramnios is a deepest pocket below 2 cm or an AFI of 5 cm or less.","This range is generally normal fluid volume.","This is borderline or low-normal, not diagnostic."]],
["What is “quickening” and when is it typically perceived by a primigravida?",["Uterine contractions felt at 12–14 weeks","Active fetal movements felt at about 18–20 weeks","Engagement of the fetal head at 36 weeks","Descent of the fundus (lightening) at 38 weeks"],1,["These may be uterine activity but are not quickening.","Correct. Quickening is the mother’s first perception of fetal movements, about 18–20 weeks in a primigravida.","Engagement is descent of the widest part of the presenting part into the pelvis.","Lightening is descent of the presenting part, which relieves pressure on the upper abdomen."]],
["Which Leopold manoeuvre determines the position of the fetal back and limbs?",["First (fundal grip)","Second (lateral/umbilical grip)","Third (Pawlik’s/pelvic grip)","Fourth (deep pelvic grip)"],1,["Identifies which fetal pole (head or breech) is in the fundus.","Correct. Palpating both sides of the abdomen identifies the back and limbs.","Identifies the presenting part and whether it is mobile or engaged.","Assesses flexion of the head and engagement."]]
]}
];
var S={v:"home",p:-1,q:[],i:0,sc:0,st:0,ok:0,pk:null,done:false,busy:false,msg:"",lbf:"All"};
var L="ABCD";
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function go(v){S.v=v;R();window.scrollTo(0,0)}
function start(pi){var src=[];PARTS.forEach(function(p,x){if(pi<0||pi==x)p.qs.forEach(function(q){src.push({p:x,q:q})})});S.p=pi;S.q=shuf(src);S.i=0;S.sc=0;S.st=0;S.ok=0;S.pk=null;S.done=false;S.busy=false;S.msg="";go("play")}
function pick(k){if(S.pk!==null)return;S.pk=k;if(k==S.q[S.i].q[2]){S.ok++;S.sc+=10+Math.min(S.st,5)*2;S.st++}else S.st=0;R()}
function nxt(){S.i++;S.pk=null;if(S.i>=S.q.length){go("end");autosave()}else go("play")}
function label(){return S.p<0?"All parts":PARTS[S.p].name}
var ME={name:"",id:""},DB=null,ROWS=[];
function lsGet(){try{return JSON.parse(localStorage.getItem("obgLB2")||"[]")}catch(e){return[]}}
function lsAdd(r){try{var a=lsGet().filter(function(x){return!(x.uid==r.uid&&x.part==r.part&&x.score>=r.score)&&!(x.uid==r.uid&&x.part==r.part)});a.push(r);localStorage.setItem("obgLB2",JSON.stringify(a))}catch(e){}}
function setName(){var v=document.getElementById("nm").value.trim().slice(0,20);if(!v){S.msg="Type your name first 🙂";R();return}ME.name=v;try{localStorage.setItem("obgNick",v)}catch(e){}S.msg="";go("home")}
function sbH(x){var h={apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json"};for(var k in x)h[k]=x[k];return h}
function sbOk(r){if(!r.ok)throw new Error(r.status);return r}
function sbMsg(t){S.msg=t;var m=document.getElementById("sv");if(m&&S.v=="end")m.textContent=t}
function loadLB(){fetch(SB.url+"/rest/v1/scores?select=name,uid,score,part,n,ok&order=score.desc&limit=300",{headers:sbH()}).then(sbOk).then(function(r){return r.json()}).then(function(a){ROWS=a;DB=true;if(S.v=="lb"||S.v=="end")showLB()}).catch(function(){})}
function autosave(){var r={name:ME.name,uid:ME.id,score:S.sc,part:label(),n:S.q.length,ok:S.ok,t:Date.now()};lsAdd(r);S.msg="Saving…";
var id=ME.id+"-"+(S.p<0?"all":S.p),q=SB.url+"/rest/v1/scores";
fetch(q+"?id=eq."+encodeURIComponent(id)+"&select=score",{headers:sbH()}).then(sbOk).then(function(x){return x.json()}).then(function(a){var o=a&&a[0];
if(o&&o.score>=r.score){sbMsg("Your best here is still "+o.score+" 💪");return fetch(q+"?id=eq."+encodeURIComponent(id),{method:"PATCH",headers:sbH({Prefer:"return=minimal"}),body:JSON.stringify({name:r.name})}).then(sbOk)}
sbMsg(o?"New personal best! 🎉":"Score saved! 🎉");
var row={id:id};for(var k in r)row[k]=r[k];
return fetch(q+"?on_conflict=id",{method:"POST",headers:sbH({Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(row)}).then(sbOk)}).then(loadLB).catch(function(){sbMsg("Saved on this device only (could not reach the online board).")})}
function showLB(){var b=document.getElementById("lbbox");if(!b)return;var a=(DB?ROWS:lsGet()).filter(function(r){return S.lbf=="All"||r.part==S.lbf});
if(S.lbf=="All"){var best={};a.forEach(function(r){var k=r.uid||r.name;if(!best[k]||r.score>best[k].score)best[k]=r});a=Object.keys(best).map(function(k){return best[k]})}
a=a.sort(function(x,y){return y.score-x.score}).slice(0,20);
if(!a.length){b.innerHTML='<div class="card" style="text-align:center"><div class="logo">🏆</div><p class="mu">No scores yet. Be the first!</p></div>';return}
var md=["🥇","🥈","🥉"],h="";a.forEach(function(r,i){var ini=esc((Array.from(r.name||"?")[0]||"?").toUpperCase());h+='<div class="row'+(i<3?' g'+(i+1):'')+(r.uid==ME.id?' me':'')+'" style="animation-delay:'+i*30+'ms"><span class="rk">'+(md[i]||(i+1))+'</span><span class="av">'+ini+'</span><span class="nm"><b>'+esc(r.name)+(r.uid==ME.id?' (you)':'')+'</b><span class="mu">'+esc(r.part)+' · '+r.ok+'/'+r.n+' correct</span></span><span class="sc">'+r.score+'</span></div>'});
b.innerHTML=h+(DB?'<p class="mu" style="text-align:center">🌐 Live: everyone sees the same leaderboard.</p>':'<p class="mu" style="text-align:center">Offline: showing scores saved on this device only.</p>')}
function R(){var a=document.getElementById("app"),h="",i;
if(S.v=="oh"||S.v=="op"||S.v=="od"){RO();return}
if(S.v=="name"){h='<div class="hero"><div class="logo">🩺</div><h1>Welcome!</h1><p>Enter your name to join the leaderboard</p></div><div class="card"><input id="nm" maxlength="20" placeholder="Your name" value="'+esc(ME.name)+'" onkeydown="if(event.key==\'Enter\')setName()"><button class="btn main" onclick="setName()">Let\'s go →</button><p class="mu">'+esc(S.msg)+'</p></div>'}
else if(S.v=="home"){h='<div class="hero"><h1>O&amp;G MCQ Bank</h1><p>Hi, <b>'+esc(ME.name)+'</b> 👋 <button class="back" onclick="go(\'name\')">change</button></p><p style="font-size:14px">Single best answer questions with an explanation for every option.</p></div>';
PARTS.forEach(function(p,x){h+='<button class="btn" onclick="start('+x+')">'+p.icon+' <b>'+p.name+'</b><br><span class="mu">'+p.qs.length+' questions</span></button>'});
h+='<button class="btn main" onclick="start(-1)">Mixed: all questions</button><button class="btn main" onclick="oh()">🗣️ History-taking (OSCE)</button><button class="btn" onclick="go(\'lb\')">🏆 Leaderboard</button><p class="mu">For study use. Check answers against your textbooks and local guidelines.</p>'}
else if(S.v=="play"){var c=S.q[S.i],q=c.q,d=S.pk!==null;
h='<div class="top"><button class="back" onclick="go(\'home\')">← Exit</button><span>Q '+(S.i+1)+'/'+S.q.length+' · Score '+S.sc+' · 🔥'+S.st+'</span></div><div class="card"><span class="tag">'+PARTS[c.p].name+'</span><p>'+q[0]+'</p></div>';
for(i=0;i<4;i++){var cl="btn";if(d){if(i==q[2])cl+=" ok";else if(i==S.pk)cl+=" bad"}h+='<button class="'+cl+'" onclick="pick('+i+')"><b>'+L[i]+'.</b> '+q[1][i]+'</button>'}
if(d){h+='<div class="card"><b>'+(S.pk==q[2]?"✅ Correct":"❌ Not quite")+'</b><p class="fb"><b>'+L[S.pk]+'.</b> '+q[3][S.pk]+'</p>'+(S.pk!=q[2]?'<p class="fb"><b>'+L[q[2]]+' (correct).</b> '+q[3][q[2]]+'</p>':'')+(q[4]?'<p class="mu">Source: '+esc(q[4])+'</p>':'')+'<button class="btn main" onclick="nxt()">'+(S.i==S.q.length-1?"Finish":"Next")+'</button></div>'}}
else if(S.v=="end"){var pc=Math.round(100*S.ok/S.q.length);
h='<div class="hero"><div class="logo">🎉</div><h1>'+S.sc+' pts</h1><p>'+S.ok+' of '+S.q.length+' correct ('+pc+'%)</p><p id="sv" style="font-size:14px">'+esc(S.msg)+'</p></div><h2>🏆 Leaderboard</h2><div id="lbbox"></div><button class="btn main" onclick="start('+S.p+')">Play again</button><button class="btn" onclick="go(\'home\')">Home</button>'}
else{h='<button class="back" onclick="go(\'home\')">← Back</button><div class="hero"><div class="logo">🏆</div><h1>Leaderboard</h1></div><select onchange="S.lbf=this.value;showLB()">';
["All","All parts"].concat(PARTS.map(function(p){return p.name})).forEach(function(x){h+='<option'+(x==S.lbf?' selected':'')+'>'+esc(x)+'</option>'});
h+='</select><div id="lbbox"></div>'}
a.innerHTML=h;
if(S.v=="lb"||S.v=="end")showLB()}

PARTS.push({name:"Female anatomy & embryology",icon:"🧬",qs:[
["A 24-year-old woman presents with irregular menstruation. Ultrasound shows a normal uterus and two ovaries in the ovarian fossae. Which structure of the ovary contains the ovarian follicles?",["Ovarian medulla","Ovarian cortex","Ovarian ligament","Mesovarium"],1,["The inner region: loose connective tissue, vessels, lymphatics and nerves.","Correct. The outer cortex contains follicles at different stages of development.","The ovarian ligament connects the ovary to the uterus.","The mesovarium is the peritoneal fold attaching the ovary to the broad ligament."]],
["A 29-year-old woman has severe lower abdominal pain and vaginal bleeding with a positive pregnancy test. Transvaginal ultrasound shows an empty uterus and a gestational sac in the ampulla of the right fallopian tube. Which statement best describes the significance of this site?",["It is the narrowest part of the tube","It is the most common site of fertilisation and about 70% of tubal ectopic pregnancies occur here","It is the part that passes through the uterine wall","It is the part that collects the ovum through its fimbriae"],1,["The isthmus is the narrow medial part.","Correct. The ampulla is the widest and longest part, the usual site of fertilisation and of tubal ectopic pregnancy.","That is the intramural (interstitial) part.","That is the infundibulum, whose fimbriae collect the oocyte."]],
["At a first antenatal visit the doctor explains that the uterus normally lies anteverted and anteflexed. Which statement describes this?",["Tilted backwards relative to the vagina, with the body bent backwards on the cervix","Tilted forwards relative to the vagina, with the body bent forwards on the cervix","Tilted backwards relative to the vagina, with the body bent forwards on the cervix","Vertical, with no angle between body and cervix"],1,["That describes a retroverted, retroflexed uterus.","Correct. Anteversion is the forward tilt relative to the vagina; anteflexion is forward bending of the body on the cervix.","That is retroverted but anteflexed.","The normal uterus has both anteversion and anteflexion."]],
["A 35-year-old woman attends cervical screening. Cervical intraepithelial neoplasia commonly develops in the transformation zone. Which region is this?",["Junction of the upper and lower thirds of the vagina","Junction between the ectocervix and endocervix","Junction between the uterus and fallopian tube","Junction between the cervix and uterine fundus"],1,["Not the transformation zone.","Correct. It is where the squamocolumnar junctions lie as epithelium undergoes metaplasia; most precancerous lesions arise here.","That is the uterotubal junction.","The fundus is the upper rounded part of the uterus."]],
["A primigravida in the first stage of labour has painful contractions from the uterus and cervix. Which pathways mainly carry visceral pain in the first stage?",["Pudendal nerve (S2–S4)","Sympathetic fibres (T10–L1)","Obturator nerve (L2–L4)","Femoral nerve (L2–L4)"],1,["Carries somatic perineal sensation; important in the second stage.","Correct. First-stage visceral pain travels via sympathetic fibres at T10–L1.","Supplies the medial thigh.","Supplies the anterior thigh and part of the medial leg."]],
["A 48-year-old woman with ovarian carcinoma is staged, and the surgeon examines the nodes around the aorta. Which lymphatic drainage is most likely involved?",["Superficial inguinal nodes","Internal iliac nodes","Para-aortic nodes","Superficial cervical nodes"],2,["Drain the superficial external genitalia (labia).","Receive lymph from pelvic structures such as parts of the uterus, cervix and vagina.","Correct. The ovaries drain mainly to the para-aortic (lumbar) nodes, reflecting their embryological origin.","Not the regional drainage of the ovary."]],
["After perineal surgery, a woman has reduced sensation over the clitoris. Which nerve is most likely injured?",["Ilioinguinal nerve","Dorsal nerve of the clitoris","Genitofemoral nerve","Obturator nerve"],1,["L1; supplies the mons pubis and anterior labia majora.","Correct. A branch of the pudendal nerve (S2–S4), it supplies sensation to the clitoris.","Supplies the upper anterior thigh and part of the external genital region, but not the clitoris.","Supplies the medial thigh."]],
["A newborn girl has a uterine anomaly caused by failure of fusion of the caudal paramesonephric (Müllerian) ducts. Which structures are affected?",["Fallopian tubes only","Uterus, cervix and upper two-thirds of the vagina","Lower one-third of the vagina only","Clitoris and labia minora"],1,["The tubes develop from the cranial unfused parts.","Correct. The fused caudal ducts form the uterovaginal primordium: uterus, cervix and upper two-thirds of the vagina.","The lower third comes from the urogenital sinus.","These develop from the genital tubercle and urogenital folds."]],
["A newborn has deficient 5-alpha-reductase activity, so testosterone cannot be converted to DHT. Which embryological structure normally develops into the penis under DHT?",["Genital tubercle","Urogenital folds","Labioscrotal swellings","Urogenital sinus"],0,["Correct. The genital tubercle forms the penis in males (the clitoris in females).","The urogenital folds form the penile urethra (labia minora in females).","The labioscrotal swellings form the scrotum (labia majora in females).","The urogenital sinus forms the lower third of the vagina in females and parts of the urethra and glands in males."]],
["A 19-year-old with primary amenorrhoea has an abnormality of the lower vagina. Which structure gives rise to the lower one-third of the vagina?",["Cranial portion of the Müllerian ducts","Caudal fused portion of the Müllerian ducts","Urogenital sinus","Genital tubercle"],2,["These form the fallopian tubes.","These form the uterus, cervix and upper two-thirds of the vagina.","Correct. The lower third forms from the urogenital sinus via the sinovaginal bulbs and vaginal plate.","Forms the clitoris in females."]]
]});
PARTS.push({name:"Physiology of pregnancy",icon:"🫀",qs:[
["A primigravida at 24 weeks has BP 110/70 mmHg and heart rate 92/min, with no symptoms. Which physiological change best explains the higher heart rate?",["Decreased cardiac output","Increased circulating blood volume","Increased systemic vascular resistance","Decreased maternal metabolic demand"],1,["Cardiac output rises in pregnancy.","Correct. Blood volume rises by about 40–50% and heart rate by 10–20 beats/min to support circulation.","Systemic vascular resistance falls.","Metabolic demand rises."]],
["At 28 weeks her haemoglobin is slightly below her pre-pregnancy level. What is the most likely explanation?",["Decreased red cell production","Plasma volume increase exceeding the increase in red cell mass","Increased red cell destruction","Reduced iron absorption"],1,["Red cell production generally increases.","Correct. Plasma volume rises 40–50% and red cell mass 20–30%, causing physiological haemodilution.","Not the normal explanation.","Iron needs rise, but reduced absorption is not the mechanism."]],
["At 22 weeks her blood pressure is slightly lower than before pregnancy. Which mechanism is mainly responsible?",["Increased systemic vascular resistance","Decreased cardiac output","Progesterone-mediated vasodilation and reduced vascular resistance","Increased blood viscosity"],2,["That would raise blood pressure.","Cardiac output increases.","Correct. Vasodilation lowers vascular resistance, especially in the second trimester.","Haemodilution lowers viscosity."]],
["At 26 weeks she passes urine more often; her urine test is normal. Which change contributes to increased urine production?",["Decreased renal blood flow","Increased glomerular filtration rate","Decreased kidney size","Reduced renal plasma flow"],1,["Renal blood flow increases.","Correct. GFR rises by about 40–50%.","The kidneys enlarge slightly.","Renal plasma flow increases."]],
["At 30 weeks, ultrasound shows mild bilateral dilatation of the renal pelvis and ureters; she has no symptoms. Which hormone is mainly responsible?",["Oxytocin","Progesterone","Prolactin","Human chorionic gonadotropin"],1,["Stimulates uterine contraction and milk ejection.","Correct. Progesterone relaxes smooth muscle, reducing ureteric tone and causing dilatation and stasis.","Stimulates milk production.","Maintains the corpus luteum in early pregnancy."]],
["At 32 weeks she has heartburn after meals and when lying down. What is the main cause?",["Increased lower oesophageal sphincter pressure","Decreased gastric acid production","Relaxation of the lower oesophageal sphincter due to progesterone","Increased intestinal peristalsis"],2,["That would prevent reflux.","Does not explain pregnancy heartburn.","Correct. Progesterone relaxes the sphincter, and the enlarging uterus raises intra-abdominal pressure.","GI motility generally decreases."]],
["At 34 weeks she has constipation with hard stools. Which mechanism best explains this?",["Increased intestinal motility","Progesterone-induced relaxation of intestinal smooth muscle","Increased gastric emptying","Increased secretion of digestive enzymes"],1,["That would speed transit.","Correct. Slower transit allows more water to be absorbed from the stool.","Not the main mechanism.","Not the main cause."]],
["At 36 weeks she has mild breathlessness climbing stairs; her respiratory rate is normal. Which change contributes?",["Decreased oxygen consumption","Increased tidal volume due to progesterone stimulation of the respiratory centre","Decreased maternal respiratory drive","Increased residual lung volume"],1,["Oxygen consumption increases.","Correct. Progesterone raises respiratory drive, tidal volume and minute ventilation.","Respiratory drive increases.","Functional residual capacity and expiratory reserve fall as the diaphragm rises."]],
["At 37 weeks she has low back pain with increased lumbar curvature. Which adaptation is responsible?",["Decreased lumbar lordosis","Relaxin and progesterone effects on ligaments with a forward shift of the centre of gravity","Increased bone density","Reduced abdominal muscle stretching"],1,["Lordosis generally increases.","Correct. Ligament laxity and a changed centre of gravity cause postural change and back pain.","Not the mechanism.","Abdominal muscles stretch as the uterus enlarges."]],
["At 39 weeks her breasts are enlarged and a small amount of yellowish fluid leaks from the nipples. What is this fluid, and which hormone drives milk production?",["Mature breast milk; oxytocin","Colostrum; prolactin","Amniotic fluid; oestrogen","Sebum; progesterone"],1,["Oxytocin causes milk ejection (let-down), not production.","Correct. Colostrum is the first yellowish milk; prolactin stimulates milk production.","Amniotic fluid surrounds the fetus.","Sebum is an oily skin secretion."]]
]});

PARTS.push({name:"Hypertensive disorders",icon:"📈",qs:[
["Which of the following conditions may cause pre-eclamptic features to appear before 20 weeks of pregnancy?",["Primigravida status","Hydatidiform mole","Obesity (BMI greater than 35 kg/m²)","Chronic renal disease"],1,["A risk factor, but features usually appear after 20 weeks.","Correct. Features usually appear after 20 weeks but can appear earlier with hydatidiform mole or acute polyhydramnios.","A general risk factor, not a cause of early onset.","Hypertension before 20 weeks here more likely means chronic hypertension."]],
["In the aetiopathogenesis of pre-eclampsia, which of the following occurs?",["Failure of the first wave of endovascular trophoblast migration at 10–12 weeks","Increased synthesis of vasodilator PGI₂ and decreased thromboxane TXA₂","Overproduction of antiangiogenic factors such as sFlt-1 and soluble endoglin","Enhanced placental angiotensinase activity with increased destruction of angiotensin II"],2,["The first wave (decidual segments) occurs normally; the second wave into the myometrial segments is impaired.","PGI₂ (vasodilator) falls and TXA₂ (vasoconstrictor) rises.","Correct. Excess sFlt-1 and soluble endoglin antagonise VEGF and PlGF and cause endothelial dysfunction.","Angiotensinase activity is reduced, increasing sensitivity to angiotensin II."]],
["In a patient with HELLP syndrome, at what platelet count threshold is platelet transfusion specifically indicated?",["Less than 150,000/mm³","Less than 100,000/mm³","Less than 50,000/mm³","Less than 20,000/mm³"],2,["This is not the stated platelet transfusion threshold.","A platelet count below 100,000/mm³ is part of the diagnostic criteria for HELLP syndrome.","Correct. Platelet transfusion is indicated when the platelet count is below 50,000/mm³ according to the stated management threshold.","Waiting until the count falls below 20,000/mm³ would be below the stated threshold."]],
["Which of the following is a criterion used to classify pre-eclampsia as severe?",["Persistent systolic BP ≥ 140 mmHg or diastolic ≥ 90 mmHg","Urinary output less than 400 mL in 24 hours","Serum creatinine greater than 0.8 mg/dL","Platelet count less than 150,000/mm³"],1,["≥ 140/90 defines hypertension; the severe range is ≥ 160/110.","Correct. Oliguria (< 400 mL/24 h) is a feature of severe pre-eclampsia.","The severe feature is creatinine above 1.1 mg/dL, not 0.8.","The severe thrombocytopenia threshold is below 100,000/mm³."]],
["Which antihypertensive should be avoided postpartum in breastfeeding women because of its association with postpartum depression?",["Labetalol","Nifedipine","Enalapril","Methyldopa"],3,["Commonly used postpartum and compatible with breastfeeding.","A suitable postpartum antihypertensive in breastfeeding women.","May be used postpartum when clinically appropriate.","Correct. Methyldopa is generally avoided in the puerperium because of its link to depressive symptoms."]],
["Which clinical feature helps differentiate essential hypertension in pregnancy from pre-eclampsia?",["Onset of hypertension after the 20th week","Blood pressure subsides completely after delivery","Fundoscopy shows silver wiring of arterioles and hypertensive retinopathy","Most commonly seen in young primigravidae"],2,["Essential hypertension predates pregnancy or is found before 20 weeks.","Essential hypertension usually persists after delivery.","Correct. These changes indicate longstanding hypertension.","That is typical of pre-eclampsia."]],
["In pre-eclampsia, why does the myometrial segment of the spiral arterioles remain responsive to vasoconstrictors?",["Excessive fibrinoid deposition replaces the endothelium and muscular wall","Endovascular cytotrophoblast invasion fails beyond the deciduomyometrial junction in the second wave (16–18 weeks)","Overproduction of nitric oxide causes sustained smooth muscle hypertrophy","The first wave of invasion at 10–12 weeks bypasses the decidual segments"],1,["This is part of normal spiral artery remodelling.","Correct. The musculoelastic media of the myometrial segment stays intact and vasoreactive.","Nitric oxide relaxes smooth muscle and is reduced in pre-eclampsia.","The first wave into the decidual segments does occur."]],
["Which statement describes the mechanism of proteinuria in pre-eclampsia?",["Afferent arteriolar dilatation causes hyperfiltration and increased tubular reabsorption","Afferent arteriolar spasm causes glomerular endotheliosis, increased capillary permeability and depressed tubular reabsorption","Immune-complex deposition thins the basement membrane, with alpha-globulin making up 50–60% of urinary protein","Raised aldosterone increases distal tubular permeability to albumin"],1,["It is spasm, not dilatation, and GFR falls.","Correct. Endothelial swelling and increased permeability cause proteinuria.","Albumin is the main urinary protein; this is not the typical pathology.","Aldosterone is generally reduced."]],
["Regarding water, electrolyte and haematological changes in severe pre-eclampsia, which occurs?",["Intravascular overhydration with haemodilution and a fall in haematocrit","Raised aldosterone drives renal sodium retention","Intravascular dehydration and extravascular overhydration, with haemoconcentration and a rise in haematocrit","DIC restricted solely to the placental bed"],2,["Severe pre-eclampsia causes intravascular depletion and haemoconcentration.","Aldosterone is generally reduced.","Correct. Increased vascular permeability moves fluid into the tissues.","DIC in severe pre-eclampsia can be systemic."]],
["In what sequence do the clinical manifestations of pre-eclampsia typically appear?",["Proteinuria → rise in systolic BP → visible ankle oedema","Rapid weight gain → visible oedema and/or hypertension → proteinuria","Rise in diastolic BP → proteinuria → abnormal weight gain","Visible facial oedema → proteinuria → rise in diastolic BP"],1,["Proteinuria is usually not first.","Correct. The classical sequence is weight gain, then oedema and/or hypertension, then proteinuria.","Weight gain usually precedes proteinuria.","Not the typical sequence."]]
]});
PARTS.push({name:"Gestational diabetes (GDM)",icon:"🍬",qs:[
["At her booking visit at 10 weeks, a 29-year-old has BMI 29 kg/m² and her mother has type 2 diabetes. Which is a recognised risk factor for GDM?",["Maternal BMI of 19 kg/m²","First-degree relative with diabetes mellitus","Previous normal pregnancy without complications","Maternal age below 20 years"],1,["A normal BMI is not a risk factor the way overweight or obesity is.","Correct. A first-degree relative with diabetes raises the risk of GDM.","A previous uncomplicated pregnancy does not increase the risk.","Older, not younger, maternal age is the risk factor."],"MOH Malaysia CPG: Management of Diabetes in Pregnancy (2017)"],
["A 27-year-old with BMI 30 kg/m² books at 9 weeks. According to the Malaysian CPG, when should she be screened for GDM?",["Only at 36–38 weeks","At booking or as early as possible","Only if glycosuria develops","Not unless fetal macrosomia is detected"],1,["Screening should not be delayed to late pregnancy.","Correct. Women with risk factors are screened at booking; if negative, the OGTT is repeated at 24–28 weeks.","Screening is risk-based, not based on glycosuria alone.","Waiting for macrosomia delays diagnosis."],"MOH Malaysia CPG: Management of Diabetes in Pregnancy (2017)"],
["A 30-year-old has a 75 g OGTT at 26 weeks: fasting 5.3 mmol/L, 2-hour 7.5 mmol/L. How does the Malaysian CPG interpret this?",["Normal glucose tolerance","Gestational diabetes mellitus","Overt diabetes mellitus","Repeat testing only after delivery"],1,["Her fasting value is above the Malaysian threshold.","Correct. GDM is diagnosed at fasting ≥ 5.1 or 2-hour ≥ 7.8 mmol/L; one abnormal value is enough.","Overt diabetes needs higher values, e.g. fasting ≥ 7.0 or random ≥ 11.1 mmol/L, with confirmation.","An abnormal OGTT needs antenatal management, not delay."],"MOH Malaysia CPG: Management of Diabetes in Pregnancy (2017)"],
["A 32-year-old is diagnosed with GDM at 28 weeks. Which physiological change contributes most directly?",["Increased maternal insulin sensitivity","Placental hormones causing increased maternal insulin resistance","Complete cessation of maternal insulin secretion","Increased renal glucose reabsorption"],1,["Insulin sensitivity falls as pregnancy progresses.","Correct. Human placental lactogen, progesterone and cortisol raise insulin resistance; GDM occurs when beta cells cannot compensate.","Insulin secretion does not stop.","Does not explain the main mechanism."]],
["A 28-year-old is newly diagnosed with GDM at 26 weeks, with mildly raised fasting glucose and no complications. What is the most appropriate initial management?",["Immediate Caesarean section","Medical nutrition therapy, exercise and blood glucose monitoring","Immediate insulin for every patient","Complete avoidance of all carbohydrates"],1,["GDM alone is not an indication for Caesarean section.","Correct. Start with diet, activity and self-monitoring; add medication if targets are not met.","Not everyone needs insulin; it depends on response to lifestyle measures.","Carbohydrates should be distributed and chosen sensibly, not eliminated."]],
["A woman with GDM is monitoring capillary glucose at home. According to the Malaysian CPG, which targets are recommended?",["Fasting ≤ 5.3; 1-hour postprandial ≤ 7.8; 2-hour postprandial ≤ 6.7 mmol/L","Fasting ≤ 7.0; 1-hour postprandial ≤ 10.0; 2-hour postprandial ≤ 9.0 mmol/L","Fasting ≤ 6.5; 1-hour postprandial ≤ 8.5; 2-hour postprandial ≤ 8.0 mmol/L","Fasting ≤ 4.0; 1-hour postprandial ≤ 5.0; 2-hour postprandial ≤ 5.5 mmol/L"],0,["Correct. These are the targets used with the Malaysian CPG.","Too high for control in pregnancy.","Not the recommended targets.","Unnecessarily low, with a risk of hypoglycaemia."],"MOH Malaysia CPG: Management of Diabetes in Pregnancy (2017)"],
["A 31-year-old with GDM has persistently raised fasting and postprandial glucose despite good adherence to diet and exercise. What is the most appropriate next step?",["Stop glucose monitoring","Start pharmacological treatment (metformin or insulin, according to the local guideline)","Restrict fluid intake","Wait until delivery before treating"],1,["Monitoring remains important.","Correct. If lifestyle measures fail, add medication; the choice follows the local guideline and clinical assessment.","Fluid restriction does not treat hyperglycaemia.","Untreated hyperglycaemia raises maternal and fetal risk."],"MOH Malaysia CPG: Management of Diabetes in Pregnancy (2017)"],
["A 34-year-old with poorly controlled GDM delivers a baby weighing 4.3 kg. Which neonatal complication is the baby at increased risk of shortly after birth?",["Neonatal hypoglycaemia","Neonatal hyperthyroidism","Congenital hypothyroidism","Neonatal haemophilia"],0,["Correct. Maternal hyperglycaemia raises fetal insulin; after birth the glucose supply stops but insulin stays high.","GDM does not typically cause this.","Not a typical direct complication of GDM.","An inherited coagulation disorder, unrelated to GDM."]],
["A 35-year-old with poorly controlled GDM has a fetus with estimated weight above the 90th centile. Which intrapartum complication is particularly associated with macrosomia?",["Shoulder dystocia","Uterine inversion","Vasa praevia","Cervical insufficiency"],0,["Correct. Macrosomia increases the risk of shoulder dystocia at vaginal delivery.","A third-stage complication, not specifically linked to macrosomia.","Fetal vessels crossing the membranes near the internal os.","Painless cervical dilatation causing loss or preterm birth."]],
["A 30-year-old with GDM delivers a healthy baby and her glucose returns to normal. Which advice is most appropriate?",["No further glucose testing is required","She has no increased risk of diabetes in future","Postpartum glucose testing, then periodic screening for type 2 diabetes","She should stay on insulin permanently"],2,["GDM can reveal an underlying predisposition to diabetes, so follow-up is needed.","Women with previous GDM have a higher lifetime risk of type 2 diabetes.","Correct. Test postpartum, screen periodically, and give lifestyle advice.","Medication is usually stopped after delivery unless persistent diabetes is found."]]
]});

PARTS.push({name:"Vaginal bleeding in pregnancy",icon:"🩸",qs:[
["A 27-year-old at 10 weeks has heavy bleeding and cramps and has passed some products of conception. The os is open and ultrasound shows retained products. What is the most likely diagnosis?",["Threatened miscarriage","Complete miscarriage","Incomplete miscarriage","Missed miscarriage"],2,["Bleeding with a closed os and a viable pregnancy.","The uterine cavity would be empty.","Correct. Some products have been expelled and some remain, with an open os.","A non-viable pregnancy retained with no expulsion."]],
["A 29-year-old at 11 weeks has a routine scan showing an embryo with no cardiac activity. She has no bleeding or pain, and the os is closed. What is the most likely diagnosis?",["Threatened miscarriage","Missed miscarriage","Inevitable miscarriage","Incomplete miscarriage"],1,["Bleeding with a potentially viable pregnancy.","Correct. A non-viable intrauterine pregnancy retained in the uterus, often symptomless, with a closed os.","Usually bleeding with an open os.","Partial expulsion of products."]],
["A 26-year-old has 7 weeks of amenorrhoea, lower abdominal pain and spotting, and feels dizzy. She is pale, BP 85/55 mmHg, pulse 120/min. What is the most likely diagnosis?",["Threatened miscarriage","Ruptured ectopic pregnancy","Complete miscarriage","Molar pregnancy"],1,["Usually bleeding without haemodynamic instability.","Correct. Amenorrhoea, pain and bleeding with hypotension and tachycardia suggest internal haemorrhage: an obstetric emergency.","Pain and bleeding settle after complete expulsion.","Does not typically cause this picture of acute internal haemorrhage."]],
["A 32-year-old at 12 weeks has bleeding and severe vomiting. The uterus is larger than dates, β-hCG is very high, and ultrasound shows a heterogeneous mass with many small cystic spaces and no fetus. What is the most likely diagnosis?",["Ectopic pregnancy","Complete hydatidiform mole","Threatened miscarriage","Placenta praevia"],1,["Implantation outside the uterine cavity.","Correct. Abnormal trophoblastic proliferation, very high β-hCG and a multicystic appearance.","A potentially viable pregnancy with a heartbeat.","Painless bleeding in later pregnancy."]],
["A 30-year-old at 32 weeks has sudden painless bright-red vaginal bleeding. She has no uterine tenderness and stable vital signs. What is the most likely diagnosis?",["Placental abruption","Placenta praevia","Uterine rupture","Threatened miscarriage"],1,["Painful bleeding with a tender, tense uterus.","Correct. Classically painless, recurrent, bright-red bleeding in the second or third trimester.","Severe pain, maternal instability and fetal compromise, especially in labour.","This occurs in early pregnancy."]],
["A 31-year-old at 34 weeks has painless bleeding, and ultrasound confirms placenta praevia covering the internal os. Which examination should be avoided?",["Abdominal examination","Ultrasound examination","Digital vaginal examination","Assessment of maternal vital signs"],2,["Assesses tenderness, contractions and lie.","Essential to determine placental location.","Correct. It may disrupt the placenta and cause severe haemorrhage.","Needed to assess stability."]],
["A 29-year-old at 35 weeks has sudden severe abdominal pain and vaginal bleeding. The uterus is tender and tense, and BP is 150/100 mmHg. What is the most likely diagnosis?",["Placenta praevia","Placental abruption","Vasa praevia","Cervical ectropion"],1,["Usually painless bleeding with a soft, non-tender uterus.","Correct. Premature separation of a normally sited placenta: painful bleeding, tender uterus, raised tone; hypertension is a risk factor.","Fetal vessels over the os; bleeding after membrane rupture.","Contact bleeding, not severe pain and tenderness."]],
["A 28-year-old at 38 weeks has spontaneous rupture of membranes, then vaginal bleeding. The fetal heart rate becomes severely abnormal, but the mother is stable. What is the most likely diagnosis?",["Placental abruption","Placenta praevia","Vasa praevia","Uterine rupture"],2,["Maternal bleeding with pain and a tender uterus.","Painless maternal bleeding.","Correct. Fetal vessels crossing the membranes near the os tear on rupture, causing fetal blood loss and sudden fetal heart rate changes.","Maternal pain, instability and fetal compromise."]],
["A 34-year-old with a previous lower-segment Caesarean is in a trial of labour. She suddenly has severe abdominal pain, abnormal fetal heart rate, stopped contractions and a presenting part that has moved up. What is the most likely diagnosis?",["Placenta praevia","Placental abruption","Uterine rupture","Vasa praevia"],2,["Painless bleeding.","Painful bleeding with a tender uterus.","Correct. A previous Caesarean is a major risk factor; warning signs are sudden pain, fetal heart rate abnormality, loss of contractions and loss of station.","Bleeding after membrane rupture with acute fetal compromise."]],
["A 35-year-old at 34 weeks has heavy vaginal bleeding, BP 85/55 mmHg and pulse 125/min. What is the most appropriate initial management?",["Perform a digital vaginal examination immediately","Arrange an outpatient ultrasound","Start maternal resuscitation with ABC assessment and intravenous access","Wait for the bleeding to stop"],2,["Avoid until placenta praevia is excluded.","Inappropriate in an unstable patient.","Correct. Stabilise first: ABC, large-bore IV access, bloods including crossmatch, and fluid and blood product resuscitation.","Waiting risks haemorrhagic shock."]],
]});
PARTS.push({name:"Hyperemesis gravidarum",icon:"🤢",qs:[
["Which of the following best defines hyperemesis gravidarum?",["Mild nausea only in the morning","Severe vomiting that affects maternal health or daily activities","Vomiting only in the third trimester","Nausea without any effect on daily activities"],1,["Mild morning sickness does not significantly affect health or daily life.","Correct. Severe vomiting that impairs maternal health and daily functioning.","It commonly occurs in the first trimester.","It significantly interferes with daily activities."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which is the triad of adverse effects of prolonged nausea and vomiting in pregnancy?",["Hypertension, proteinuria and oedema","Dehydration, electrolyte imbalance and more than 5% weight loss","Fever, tachycardia and abdominal pain","Anaemia, hypoglycaemia and jaundice"],1,["These are associated with pre-eclampsia.","Correct. These are the three major adverse effects.","Not the characteristic triad.","Not the defining features."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which is a recognised risk factor for hyperemesis gravidarum?",["Older maternal age","High body mass","History of motion sickness or migraine","Previous uncomplicated pregnancy"],2,["Younger age is associated with higher risk.","Low body mass is a recognised risk factor.","Correct. A history of motion sickness or migraine raises the risk.","Not a recognised risk factor."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which hormonal factor is associated with hyperemesis gravidarum?",["Reduced hCG levels","Increased hCG levels","Reduced progesterone levels","Reduced oestrogen levels"],1,["Increased hCG levels are associated with vomiting.","Correct. High hCG, as in multiple pregnancy or hydatidiform mole, is linked with more vomiting.","Progesterone excess is one of the proposed hormonal factors.","Increased oestrogen levels are associated with vomiting."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which electrolyte abnormality may develop from prolonged vomiting in hyperemesis gravidarum?",["Hypokalaemia","Hypercalcaemia","Hypernatraemia","Hypermagnesaemia"],0,["Correct. Potassium is lost through vomiting.","Not a typical disturbance in hyperemesis.","Sodium is usually depleted by vomiting and fluid loss.","Not a characteristic disturbance."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which urine finding is commonly associated with hyperemesis gravidarum?",["Increased urine volume with dilute urine","Presence of ketone bodies","Persistent glycosuria","Increased chloride concentration"],1,["Dehydration gives low volume, concentrated urine.","Correct. Starvation and carbohydrate depletion cause fat breakdown, producing ketones.","Not characteristic.","Vomiting causes loss of hydrochloric acid and chloride."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which neurological complication may occur from thiamine deficiency in hyperemesis gravidarum?",["Wernicke’s encephalopathy","Meningitis","Cerebral infarction","Parkinson’s disease"],0,["Correct. Prolonged vomiting can cause vitamin B1 deficiency and Wernicke’s encephalopathy.","Not a recognised complication.","Not a typical complication.","Unrelated to thiamine deficiency in hyperemesis."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which of the following is an indication for hospitalisation in hyperemesis gravidarum?",["Mild nausea without vomiting","Vomiting that responds to oral antiemetics","Continued vomiting despite oral antiemetic treatment","Normal oral intake without dehydration"],2,["Mild symptoms can usually be managed at home.","Those who respond to oral treatment may not need admission.","Correct. Persistent vomiting despite treatment needs admission for fluid and electrolyte correction.","No indication for admission."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which medication combination is used to manage nausea and vomiting in pregnancy?",["Doxylamine and vitamin B6","Methotrexate and folic acid","Warfarin and heparin","Insulin and glucagon"],0,["Correct. This combination is considered safe and effective.","Methotrexate is not an antiemetic; it is used in some ectopic pregnancies.","Anticoagulants.","They regulate blood glucose."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"],
["Which finding indicates clinical improvement in hyperemesis gravidarum?",["Persistent ketonuria","Reduced urine output","Normalisation of blood biochemistry","Increasing frequency of vomiting"],2,["Persistent ketonuria suggests continued starvation.","May indicate persistent dehydration.","Correct. Normal electrolytes show that fluid and electrolyte disturbance has improved.","Increasing vomiting means worsening."],"Textbook of Obstetrics, Hyperemesis Gravidarum, pp. 147–150"]
]});

var TT="Obstetrics by Ten Teachers, 21st edition (2024), Chapter 2: Antenatal Care",DD="DC Dutta’s Textbook of Obstetrics, 9th edition (2018), Chapter 20: Anaemia in Pregnancy";
PARTS.push({name:"Anaemia in pregnancy",icon:"🩸",qs:[
["A 24-year-old primigravida attends her antenatal booking visit at 9 weeks’ gestation. She is completely asymptomatic, and her booking full blood count shows a haemoglobin (Hb) of 10.4 g/dL (104 g/L). What is the most appropriate interpretation of this result?",["Anaemia only if the mean corpuscular volume (MCV) is below 70 fL","First-trimester anaemia requiring further evaluation","Normal physiological haemodilution of pregnancy requiring no action","Severe anaemia requiring immediate blood transfusion"],1,["MCV classifies the type of anaemia, but the diagnosis uses the trimester-specific Hb threshold.","Correct. In the first trimester anaemia is Hb below 11.0 g/dL (110 g/L); 10.4 g/dL warrants investigation.","Haemodilution occurs, but values below 11.0 g/dL in the first trimester must be investigated.","10.4 g/dL is mild anaemia in an asymptomatic patient, not severe anaemia needing transfusion."],TT],
["A 28-year-old woman at 26 weeks’ gestation has progressive fatigue and reduced exercise tolerance. Investigations show Hb 8.9 g/dL, MCV 70 fL, MCH 22 pg, serum iron 25 μg/dL, total iron-binding capacity (TIBC) 430 μg/dL and serum ferritin 18 μg/L. What is the most likely diagnosis?",["Beta-thalassaemia minor","Vitamin B12 deficiency","Folate-deficiency megaloblastic anaemia","Iron-deficiency anaemia"],3,["Causes microcytosis, but iron studies are typically normal.","Classically causes macrocytic anaemia.","Also causes a macrocytic picture, not low MCV with depleted iron.","Correct. Low MCV and MCH with low serum iron, raised TIBC and low ferritin indicate iron-deficiency anaemia."],DD+", Box 20.2"],
["A 30-year-old pregnant woman has microcytic anaemia on routine screening. A serum ferritin is requested to assess iron stores. Which result most strongly supports iron-deficiency anaemia?",["Serum ferritin 12 μg/L","Serum ferritin 45 μg/L","Serum ferritin 85 μg/L","Serum ferritin 150 μg/L"],0,["Correct. Ferritin below 30 μg/L indicates depleted iron stores, absent active inflammation or infection.","Above the 30 μg/L threshold for depleted stores.","Adequate stores; look for other causes such as thalassaemia trait.","Does not support iron depletion; ferritin can rise as an acute-phase reactant."],DD+", Box 20.2"],
["A 26-year-old at 18 weeks has persistent microcytosis (MCV 68 fL), but her serum ferritin and iron studies are normal. What is the most appropriate next investigation?",["Reticulocyte count alone","Serum vitamin B12 assay","Haemoglobin electrophoresis","Serum folate level"],2,["Assesses marrow activity but cannot identify haemoglobin variants or thalassaemia.","B12 deficiency causes macrocytic anaemia.","Correct. Persistent microcytosis with normal iron studies needs a haemoglobinopathy, especially thalassaemia trait, excluded.","Folate deficiency causes macrocytosis."],DD],
["A 32-year-old at 29 weeks has taken oral iron for confirmed anaemia for four weeks. Her haemoglobin has not risen and her reticulocyte count remains low. Assuming good adherence and no ongoing blood loss, which concomitant deficiency should be considered?",["Vitamin K deficiency","Calcium deficiency","Vitamin C excess","Folic acid deficiency"],3,["Needed for clotting factors; does not affect red cell maturation.","Calcium taken with iron may reduce absorption, but calcium deficiency does not cause this picture.","Vitamin C enhances iron absorption.","Correct. Coexisting folate deficiency limits erythropoiesis and blunts the response to iron."],DD],
["A 35-year-old at 34 weeks has confirmed moderate iron-deficiency anaemia. She has severe nausea, abdominal pain and vomiting whenever she takes oral iron and cannot tolerate it. Which management is most appropriate?",["Continue the same oral iron dose despite severe intolerance","Parenteral iron therapy","Oral folic acid monotherapy","Stop all iron therapy and reassess after delivery"],1,["Leads to poor compliance and uncorrected anaemia near delivery.","Correct. Parenteral iron is indicated when oral iron is not tolerated, especially in late pregnancy when rapid replenishment is needed.","Folic acid will not correct iron deficiency.","Leaves moderate anaemia untreated at 34 weeks, with intrapartum and postpartum risks."],DD+", pp. 249–250"],
["A 27-year-old with severe untreated anaemia at 31 weeks has worsening breathlessness at rest and signs of cardiac strain. Which serious maternal complication is characteristic around this gestational age?",["Pulmonary embolism","High-output heart failure","Puerperal subinvolution","Placental abruption"],1,["An important differential for acute dyspnoea, but severe anaemia specifically precipitates cardiac decompensation around 30–32 weeks.","Correct. Cardiac output and plasma volume peak around 30–32 weeks; severe anaemia can precipitate high-output heart failure.","Occurs after delivery.","Painful bleeding and uterine tenderness, not cardiac strain."],DD],
["A woman with significant anaemia enters active labour. Which complication is emphasised as a major threat in anaemic women, even when blood loss is relatively small?",["Postpartum haemorrhage and decompensation from blood loss","Placenta praevia","Shoulder dystocia","Uterine inversion"],0,["Correct. Reduced physiological reserve means even moderate blood loss can cause hypovolaemic shock.","A cause of painless antepartum haemorrhage, not a result of anaemia.","A mechanical problem related to macrosomia or pelvic dimensions.","A rare mechanical complication of the third stage."],DD],
["A woman with severe anaemia has just delivered. Which is a recognised puerperal complication associated with maternal anaemia?",["Cervical insufficiency","Ectopic pregnancy","Puerperal sepsis","Hyperemesis gravidarum"],2,["Causes painless second-trimester loss or preterm birth.","Early pregnancy implantation outside the uterus.","Correct. Anaemia impairs immune defences and tissue oxygenation, predisposing to sepsis, subinvolution, poor lactation, VTE and delayed wound healing.","Early-pregnancy vomiting, not a puerperal complication."],DD],
["A 23-year-old multiparous woman at 22 weeks has iron-deficiency anaemia. She has poor dietary iron intake and three pregnancies within four years. Which explanation best accounts for her increased risk?",["Plasma-volume expansion is the sole cause of true iron depletion","Inadequate dietary intake with increased pregnancy demand and insufficient iron replenishment between closely spaced pregnancies","Reduced maternal iron requirements during the second trimester","Cessation of menstruation increases total iron loss in pregnancy"],1,["Causes haemodilution but does not deplete total body iron on its own.","Correct. Pregnancy greatly increases iron demand, and poor intake with short birth intervals prevents recovery of stores.","Iron requirements rise markedly in the second and third trimesters.","Amenorrhoea saves menstrual iron loss, though demands outweigh it."],DD]
]});
PARTS.push({name:"Contraception",icon:"💊",qs:[
["A 29-year-old woman who smokes 15 cigarettes daily requests combined oral contraception. Which clinical factor primarily drives the restriction on combined hormonal methods in this patient?",["Estrogen-induced thrombotic risk","Progestogen-driven ovulation suppression","Impaired hepatic clearance of follicle-stimulating hormone","Irreversible endometrial atrophy"],0,["Correct. Ethinylestradiol raises hepatic procoagulant factors and lowers natural anticoagulants such as protein S; with smoking this raises arterial and venous thromboembolism risk.","Ovulation suppression is the contraceptive mechanism, not a cardiovascular safety restriction.","FSH is not cleared through the mechanism described.","Endometrial thinning from combined pills is temporary and reverses after stopping."]],
["Which mechanism is the primary contraceptive action of the levonorgestrel-releasing intrauterine system (LNG-IUS) in most users?",["Complete suppression of the luteinising hormone surge","Endometrial decidualisation and cervical mucus thickening","Mechanical tubal occlusion at the uterotubal junction","Inhibition of pituitary gonadotropin-releasing hormone pulsatility"],1,["Systemic levonorgestrel is low and most users still ovulate.","Correct. Local levonorgestrel causes endometrial atrophy/decidualisation and thickens cervical mucus, blocking sperm ascent.","The device sits in the endometrial cavity and does not occlude the tubes.","It does not consistently suppress the hypothalamic-pituitary axis."]],
["A 24-year-old taking a traditional low-dose progestogen-only pill (POP) takes her tablet 5 hours late. What is the most appropriate advice?",["Take the missed pill now and use additional contraception for 48 hours","Continue the pack normally without backup contraception","Discontinue the pack and await withdrawal bleeding","Double the dose for the next 7 consecutive days"],0,["Correct. Traditional POPs have a 3-hour window: take the missed pill, resume daily dosing and use extra contraception for 48 hours.","She may be unprotected because the 3-hour window has passed.","Stopping the pack increases pregnancy risk; traditional POPs are taken continuously.","Doubling doses for a week is unnecessary."]],
["A 31-year-old woman with epilepsy on carbamazepine requests long-term contraception. Which method is least affected by hepatic enzyme induction?",["Combined oral contraceptive pill","Progestogen-only subdermal implant","Levonorgestrel intrauterine system","Combined transdermal contraceptive patch"],2,["Hepatic metabolism and enzyme induction may reduce hormone levels.","Relies on systemic hormone levels that enzyme induction may reduce.","Correct. The LNG-IUS acts mainly locally, so its efficacy is not significantly affected by enzyme inducers.","Avoids first-pass metabolism but delivers systemic hormones that can still be affected."]],
["A 26-year-old with migraine with aura seeks hormonal contraception. Which option should be avoided because of stroke risk?",["Desogestrel progestogen-only pill","Combined hormonal contraceptive patch","Etonogestrel subdermal implant","Depot medroxyprogesterone acetate injection"],1,["Contains no estrogen; generally suitable with migraine with aura.","Correct. Migraine with aura is an independent risk factor for ischaemic stroke; estrogen-containing methods, including the patch, are contraindicated.","A progestogen-only method.","A progestogen-only method with no estrogen."]],
["Which non-contraceptive gynaecological benefit is characteristically associated with combined oral contraceptive use?",["Reduced risk of epithelial ovarian cancer","Prevention of cervical intraepithelial neoplasia","Resolution of uterine submucosal fibroids","Elimination of pelvic inflammatory disease risk"],0,["Correct. Combined pills suppress ovulation and reduce the risk of epithelial ovarian cancer; they also protect against endometrial cancer.","They do not prevent HPV-driven CIN.","They may reduce heavy bleeding from fibroids but do not resolve them.","They do not protect against STIs or eliminate PID risk."]],
["A 22-year-old presents 48 hours after unprotected intercourse and requests emergency contraception. Which regimen is a standard oral hormonal option?",["Single-dose oral levonorgestrel 1.5 mg","High-dose intramuscular medroxyprogesterone","Continuous ethinylestradiol for 5 days","Single-dose oral mifepristone 600 mg"],0,["Correct. Levonorgestrel 1.5 mg is licensed up to 72 hours; ulipristal acetate 30 mg can be used up to 120 hours.","DMPA is a maintenance method, not used for emergency contraception.","High-dose unopposed estrogen regimens are obsolete because of adverse effects.","Not a standard emergency contraception regimen."]],
["A 34-year-old using depot medroxyprogesterone acetate (DMPA) for 3 years is concerned about long-term side effects. Which adverse effect requires counselling?",["Reversible reduction in bone mineral density","Premature ovarian insufficiency","Dose-dependent hepatic adenoma formation","Progressive hypertension requiring discontinuation"],0,["Correct. DMPA suppresses gonadotropins and causes a hypo-oestrogenic state, lowering bone density during prolonged use; it generally recovers after stopping.","Return of fertility can be delayed, but DMPA does not cause premature ovarian insufficiency.","Hepatic adenomas are linked more to exogenous estrogen.","Hypertension is more associated with estrogen-containing contraceptives."]],
["A 27-year-old is 4 weeks postpartum and exclusively breastfeeding. Which hormonal contraceptive best aligns with safe postpartum initiation?",["Combined oral contraceptive pill","Combined vaginal contraceptive ring","Progestogen-only subdermal implant","Combined transdermal contraceptive patch"],2,["Estrogen-containing methods are generally avoided early postpartum in breastfeeding women (milk supply and VTE risk).","Contains estrogen; not preferred at 4 weeks postpartum.","Correct. Progestogen-only methods such as the etonogestrel implant can be started postpartum in breastfeeding women.","Contains estrogen; generally avoided early postpartum."]],
["During counselling on long-acting reversible contraception (LARC), which statement explains why LARC outperforms user-dependent pills in typical use?",["They eliminate daily adherence errors","They contain higher daily estrogen doses","They permanently alter tubal ciliary motility","They prevent all sexually transmitted infections"],0,["Correct. LARC removes daily user dependency, reducing missed doses and typical-use failure.","Currently available LARC methods are estrogen-free.","LARC methods are reversible.","They do not protect against STIs; condoms are still advised."]]
